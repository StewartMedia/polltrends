name: PolTrends daily update

# One pipeline, run by GitHub. No local machine, cron or model is involved.
# 19:30 UTC = 06:30 AEDT / 05:30 AEST: fetch Google Trends, news and polls.
# 07:30 UTC = 18:30 AEDT: refresh news and polls (Trends is skipped when today's
# snapshot already exists, to stay well inside Google's rate limits).
# A push that changes pipeline code also runs it, so code changes are tested in
# CI and deployed straight away. The bot's own data/docs commits do not trigger it.
on:
  schedule:
    - cron: '30 19 * * *'
    - cron: '30 7 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'site/**'
      - 'requirements.txt'
      - '.github/workflows/poltrends.yml'
  workflow_dispatch:
    inputs:
      force_trends:
        description: 'Refetch Google Trends even if today already has a snapshot'
        type: boolean
        default: false

concurrency:
  group: poltrends-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: '1'
          POLTRENDS_FORCE_TRENDS: ${{ inputs.force_trends && '1' || '' }}
        run: python scripts/run_daily.py

      # Posts to X (@poltrendsau) from fixed templates. Mode comes from the repository
      # variable X_POST_MODE: off, dry-run (default: drafts only) or live.
      # A failure here never blocks the site update.
      - name: Post to X
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          X_POST_MODE: ${{ vars.X_POST_MODE || 'dry-run' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_x.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "PolTrends update: $(TZ=Australia/Melbourne date +%Y-%m-%d\ %H:%M)"
          git pull --rebase origin main
          git push origin HEAD:main
