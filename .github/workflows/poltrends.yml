name: PolTrends daily update

# One pipeline, run by GitHub. No local machine, cron or model is involved.
# 19:30 UTC = 06:30 AEDT / 05:30 AEST: fetch Google Trends, news and polls.
# 07:30 UTC = 18:30 AEDT: refresh news and polls (Trends is skipped when today's
# snapshot already exists, to stay well inside Google's rate limits).
on:
  schedule:
    - cron: '30 19 * * *'
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      force_trends:
        description: 'Refetch Google Trends even if today already has a snapshot'
        type: boolean
        default: false

concurrency:
  group: poltrends-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: '1'
          POLTRENDS_FORCE_TRENDS: ${{ inputs.force_trends && '1' || '' }}
        run: python scripts/run_daily.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "PolTrends update: $(TZ=Australia/Melbourne date +%Y-%m-%d\ %H:%M)"
          git pull --rebase origin main
          git push origin HEAD:main
